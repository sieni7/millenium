<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millénium Consulting Innovation (MCI) — Conseil en Transformation Digitale</title>
    <meta name="description" content="Cabinet de conseil en innovation numérique au service des coopératives, PME et institutions locales en Côte d'Ivoire.">
    <meta property="og:title" content="Millénium Consulting Innovation — Transformation Digitale">
    <meta property="og:description" content="Accompagnement sur mesure pour votre projet numérique.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="icon" type="image/png" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="canonical" href="https://milleniumci.netlify.app/">
    <meta name="theme-color" content="#174C32">
    <link rel="preload" as="image" href="/assets/placeholder-hero.jpg">
    <!-- Styles bundled by Vite -->
    <style>
        /* ==========================================
           MCI GREEN / GOLD / IVORY — Design Tokens
           ========================================== */
        :root {
            /* Verts */
            --mci-green-900: #10261B;
            --mci-green-800: #174C32;
            --mci-green-700: #1D6241;
            --mci-green-600: #087A52;
            --mci-green-500: #159A6B;
            --mci-green-400: #43B889;

            /* Ors */
            --mci-gold-900: #75420F;
            --mci-gold-800: #9A5A18;
            --mci-gold-700: #A97520;
            --mci-gold-600: #C9902E;
            --mci-gold-500: #D7A447;
            --mci-gold-400: #E7B968;

            /* Ivoire & Neutres */
            --mci-ivory-100: #FFFFFF;
            --mci-ivory-200: #FDFCFA;
            --mci-ivory-300: #F7F3EC;
            --mci-ivory-400: #EEE8DD;
            --mci-neutral-500: #78857D;
            --mci-neutral-600: #596961;
            --mci-neutral-700: #496056;

            /* ===== MODE CLAIR ===== */
            --color-bg: var(--mci-ivory-300);
            --color-bg-surface: var(--mci-ivory-100);
            --color-bg-muted: var(--mci-ivory-400);

            --color-text: var(--mci-green-900);
            --color-text-secondary: var(--mci-neutral-700);
            --color-text-muted: var(--mci-neutral-600);

            --color-primary: var(--mci-green-800);
            --color-primary-hover: var(--mci-green-900);

            --color-accent: var(--mci-gold-600);
            --color-accent-hover: var(--mci-gold-700);

            --color-border: #DCD5C8;
            --color-border-light: #E9E4DA;

            --color-success: var(--mci-green-600);
            --color-warning: var(--mci-gold-600);

            /* ===== ALIAS (Compatibilité composants) ===== */
            --background: var(--color-bg);
            --background-soft: var(--color-bg-muted);
            --surface: var(--color-bg-surface);
            --text-dark: var(--color-text);
            --text-primary: var(--color-text);
            --text-secondary: var(--color-text-secondary);
            --text-muted: var(--color-text-muted);
            --primary: var(--color-primary);
            --primary-hover: var(--color-primary-hover);
            --secondary: var(--color-accent);
            --secondary-hover: var(--color-accent-hover);
            --accent: var(--color-accent);
            --soft-green: var(--mci-green-400);
            --glass: rgba(253, 252, 250, 0.9);
            --border-soft: var(--color-border-light);
            --border-strong: var(--color-border);
            --overlay-dark: rgba(16, 38, 27, 0.55);
            --overlay-soft: rgba(253, 252, 250, 0.85);
            --success: var(--color-success);
            --warning: var(--color-warning);
            --font-heading: 'Inter', sans-serif;
            --font-body: 'Montserrat', sans-serif;
            --shadow-soft: 0 10px 30px rgba(23, 76, 50, 0.08);
            --shadow-premium: 0 20px 40px rgba(23, 76, 50, 0.15);
            --transition: all 400ms cubic-bezier(0.23, 1, 0.32, 1);

            /* COULEURS DES COMPOSANTS (Accents & Stats) */
            --color-stat-number: var(--mci-gold-600);
            --color-card-border-hover: var(--mci-gold-600);
            --color-service-icon-bg: var(--mci-ivory-200);
            --color-nav-active-border: var(--mci-gold-600);
        }

        body.dark-mode {
            /* ===== MODE SOMBRE ===== */
            --background: #0B1711;
            --background-soft: #163124;
            --surface: #10231A;

            --text-dark: #F5F1E8;
            --text-primary: #F5F1E8;
            --text-secondary: #C5D0C9;
            --text-muted: #899991;

            --primary: #2A8A61;
            --primary-hover: #36A978;
            --secondary: #D7A447;
            --secondary-hover: #E7B968;
            --accent: #D7A447;

            --soft-green: #163124;
            --glass: rgba(11, 23, 17, 0.85);

            --border-soft: rgba(245, 241, 232, 0.08);
            --border-strong: rgba(245, 241, 232, 0.15);

            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-premium: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: var(--font-body); font-size: 16px; line-height: 1.65; background-color: var(--background); color: var(--text-dark); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 700; line-height: 1.2; }
        h1 { font-weight: 800; letter-spacing: -0.02em; }
        h2 { font-weight: 700; letter-spacing: -0.01em; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 40px; }

        header { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-soft); position: fixed; width: 100%; top: 0; z-index: 5000; height: 120px; display: flex; align-items: center; }
        nav { display: flex; justify-content: space-between; align-items: center; width: 100%; transition: var(--transition); }
        .logo { font-family: var(--font-heading); font-size: 2rem; font-weight: 700; color: var(--secondary); text-decoration: none; display: flex; align-items: center; gap: 12px; margin-right: 60px; }
        ul.nav-links { display: flex; gap: 50px; list-style: none; align-items: center; margin-left: auto; margin-right: 50px; }
        ul.nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 700; font-size: 1.05rem; transition: var(--transition); text-transform: uppercase; letter-spacing: 1px; }
        ul.nav-links a:hover { color: var(--primary); }
        
        .btn { background: var(--primary); color: #fff; padding: 14px 28px; border-radius: 50px; text-decoration: none; font-weight: 600; transition: var(--transition); display: inline-flex; align-items: center; gap: 10px; box-shadow: var(--shadow-soft); border: none; cursor: pointer; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-premium); }
        .btn:active { transform: translateY(0); }
        .btn-sm { padding: 8px 22px; font-size: 0.9rem; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; }

        .section-title { text-align: center; margin-bottom: 60px; }
        .section-title h2 { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
        .section-title span { display: block; width: 80px; height: 3px; background: var(--primary); margin: 0 auto; }

        /* Or rare : trait fin uniquement sur les sections principales */
        .section-title.with-underline span { display: none; }
        .section-title.with-underline::after {
            content: '';
            display: block;
            width: 72px;
            height: 2px;
            background: var(--secondary);
            margin: 14px auto 0;
        }

        /* Préfixe numéroté en or pour les sections secondaires */
        .section-title.numbered::before {
            content: attr(data-number);
            display: block;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        /* Sections spacing */
        section { padding: clamp(60px, 8vh, 100px) 0; }

        /* Progress Bar (N3-006) */
        .progress-bar-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 10000; background: transparent; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.1s ease; box-shadow: 0 0 10px var(--primary); }

        /* WhatsApp Widget */
        .whatsapp-widget { 
            position: fixed; 
            bottom: 100px; 
            right: 40px; 
            background: #25D366; 
            color: white; 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 30px; 
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4); 
            z-index: 4500; 
            cursor: pointer; 
            transition: var(--transition);
            text-decoration: none;
            animation: pulse-wa 2s infinite;
        }
        .whatsapp-widget:hover { 
            transform: scale(1.1) translateY(-5px); 
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.6); 
        }
        @keyframes pulse-wa {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
        @media (max-width: 768px) {
            .whatsapp-widget { bottom: 90px; right: 20px; width: 50px; height: 50px; font-size: 24px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav id="main-nav">
                <a href="/" class="logo-header" aria-label="Millénium Consulting Innovation">
                    <img src="./assets/logo_millenium.png" alt="Millénium Consulting Innovation" width="1000" height="500" fetchpriority="high">
                </a>
                
                <ul class="nav-links">
                    <li><a href="#about" class="nav-link">Accueil</a></li>
                    <li><a href="#services" class="nav-link">Services</a></li>
                    <li><a href="#realisations" class="nav-link">Réalisations</a></li>
                    <li><a href="#equipe" class="nav-link">Équipe</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>

                <div class="nav-actions" style="display: flex; align-items: center; gap: 30px;">
                    <button id="theme-toggle" class="theme-btn" aria-label="Basculer le thème" style="background: none; border: none; color: var(--secondary); font-size: 1.2rem; cursor: pointer; transition: var(--transition);">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>

                <button class="burger" id="mobile-burger" aria-label="Menu Mobile">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <div id="hero-slider-container">
            <div class="carousel" id="carousel" role="region" aria-roledescription="carrousel" aria-live="polite">
                <div class="slide" style="background-image: url('/assets/placeholder-hero.jpg')" role="group" aria-roledescription="diapositive" aria-label="1 sur 1">
                    <div class="slide-content">
                        <h1>Transformer le potentiel local en présence digitale durable</h1>
                        <p>Cabinet de conseil en innovation numérique au service des coopératives et des PME</p>
                        <a href="#services" class="btn" aria-label="Découvrir nos services - Transformer le potentiel local en présence digitale durable">Découvrir nos services</a>
                    </div>
                </div>
            </div>
            <button class="carousel-btn prev" id="prev" aria-label="Diapositive précédente">
                <i class="fas fa-chevron-left" aria-hidden="true"></i>
            </button>
            <button class="carousel-btn next" id="next" aria-label="Diapositive suivante">
                <i class="fas fa-chevron-right" aria-hidden="true"></i>
            </button>
            <div class="dots" id="dots" role="tablist" aria-label="Sélection des diapositives">
                <div class="dot active" data-index="0" role="tab" aria-label="Aller à la diapositive 1" aria-selected="true" tabindex="0"></div>
            </div>
        </div>

        <!-- About Section -->
        <section id="about" class="about-section reveal">
            <div class="container">
                <div class="about-grid">
                    <div id="about-text-container">
                        <!-- Hydrated by main.js -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Services Section -->
        <section id="services" class="services-section reveal">
            <div class="container">
                <div class="section-title with-underline">
                    <h2>Nos expertises</h2>
                    <span></span>
                </div>
                <div id="services-container"></div>
            </div>
        </section>

        <!-- Projects / Case Study Section -->
        <section id="realisations" class="projects-section reveal">
            <div class="container">
                <div class="section-title numbered with-underline" data-number="01">
                    <h2>Réalisations</h2>
                    <span></span>
                </div>
                <div id="projects-container"></div>
            </div>
        </section>

        <!-- Team Section -->
        <section id="equipe" class="team-section reveal">
            <div class="container">
                <div class="section-title numbered" data-number="02">
                    <h2>L'équipe</h2>
                    <span></span>
                </div>
                <div id="team-container"></div>
            </div>
        </section>

        <!-- Partners Section (conditional) -->
        <div id="partners-section-container" class="reveal"></div>

        <!-- SECTION CONTACT -->
        <section id="contact" class="contact-section reveal">
          <div class="container" id="contact-container">
            <!-- Dynamisé par ContactForm.render() -->
          </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Product Modal (legacy, kept for compatibility) -->
    <div id="product-modal-container"></div>

    <!-- Sticky CTA (legacy) -->
    <div id="sticky-cta-container"></div>

    <!-- Toast Container (N3-013) -->
    <div id="toast-root"></div>

    <!-- Mobile Bottom Navigation -->
    <div id="bottom-nav-container"></div>

    <!-- Back to Top Button -->
    <button id="back-to-top" class="back-to-top" aria-label="Retour en haut">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Image Zoom Overlay (ProMax Phase 2) -->
    <div id="image-zoom-overlay" class="image-zoom-overlay">
        <img id="zoomed-image" src="" alt="Agrandissement">
    </div>

    <script type="module" src="js/refinements.js"></script>
    <script type="module" src="js/main.js"></script>
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[PWA] Service Worker Registered', reg))
            .catch(err => console.log('[PWA] Service Worker Failed', err));
        });
      }
    </script>
</body>
</html>
